name: thos-local

services:
  postgres:
    # pgvector-enabled Postgres for profile/job embedding similarity search.
    image: pgvector/pgvector:pg17
    container_name: thos-postgres
    environment:
      POSTGRES_USER: thos
      POSTGRES_PASSWORD: thos
      POSTGRES_DB: thos
    ports:
      - "5432:5432"
    volumes:
      - thos-postgres-data:/var/lib/postgresql/data
    healthcheck:  
      test: ["CMD-SHELL", "pg_isready -U thos -d thos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  thos-postgres-data:
