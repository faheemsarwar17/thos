[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "thos-backend"
version = "0.1.0"
description = "THOS FastAPI backend foundation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "bcrypt>=4.2,<5.0",
  "fastapi>=0.115,<1.0",
  "langchain>=0.3,<2.0",
  "langchain-core>=0.3,<2.0",
  "langchain-openai>=0.3,<2.0",
  "livekit-api>=0.8,<2.0",
  "livekit>=1.0,<2.0",
  "livekit-agents>=1.6,<2.0",
  "livekit-plugins-openai>=1.6,<2.0",
  "livekit-plugins-silero>=1.6,<2.0",
  "openai>=1.0,<3.0",
  "aiohttp>=3.11,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "loguru>=0.7,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "PyJWT>=2.10,<3.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
  "aiosmtplib>=3.0,<4.0",
  "boto3>=1.34,<2.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
